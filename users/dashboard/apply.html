<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamProtech Service Application</title>
  <style>
    :root {
      --grad-green: linear-gradient(135deg, #2ecc71, #27ae60);
      --grad-violet: linear-gradient(135deg, #9b59b6, #8e44ad);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #2c3e50, #000000);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-color);
    }

    /* Glassmorphism Container */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 300;
      letter-spacing: 1px;
      background: var(--grad-green);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Form Styling */
    .form-group {
      position: relative;
      margin-bottom: 25px;
    }

    .input-field {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: #fff;
      outline: none;
      transition: 0.3s;
      font-size: 16px;
    }

    .input-field:focus {
      border-color: #2ecc71;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Floating Labels */
    .form-group label {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      transition: 0.3s ease all;
    }

    .input-field:focus~label,
    .input-field:not(:placeholder-shown)~label {
      top: -10px;
      left: 10px;
      font-size: 12px;
      color: #2ecc71;
      background: #1a1a1a;
      padding: 0 5px;
      border-radius: 4px;
    }

    select.input-field {
      cursor: pointer;
      appearance: none;
    }
	
	select.input-field option {
    background-color: #2c3e50;
    color: #ffffff;
    padding: 10px;
	}

    /* Buttons */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-submit {
      background: var(--grad-green);
    }

    .btn-home {
      background: var(--grad-violet);
    }

    svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Spinner Overlay */
    #spinner {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2ecc71;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Success Message Overlay */
    #msg-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 101;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .msg-box {
      background: #1a1a1a;
      border: 1px solid #2ecc71;
      padding: 30px;
      border-radius: 15px;
      max-width: 400px;
      text-align: center;
      position: relative;
    }

    .close-msg {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      font-size: 24px;
      color: #ff4d4d;
    }
  </style>
</head>

<body>

  <div id="spinner">
    <div class="loader"></div>
    <p style="margin-top: 15px;">Processing Application...</p>
  </div>

  <div id="msg-overlay">
    <div class="msg-box">
      <span class="close-msg" onclick="closeMsg()">&times;</span>
      <p id="response-text"></p>
    </div>
  </div>

  <div class="glass-card">
    <h2>TeamProtech Service Application</h2>
    <form id="appForm">
      <div class="form-group">
        <input type="text" name="name" class="input-field" placeholder=" " required>
        <label>Full Name</label>
      </div>
      <div class="form-group">
        <input type="text" name="address" class="input-field" placeholder=" " required>
        <label>Address</label>
      </div>
      <div class="form-group">
        <select name="brgy" class="input-field" required>
          <option value="" disabled selected hidden></option>
          <option value="Brgy. 170">Brgy. 170</option>
          <option value="Brgy. 172">Brgy. 172</option>
          <option value="Brgy. 174">Brgy. 174</option>
          <option value="Brgy. 175">Brgy. 175</option>
          <option value="Brgy. 178">Brgy. 178</option>
          <option value="Brgy. 179">Brgy. 179</option>
          <option value="Brgy. 180">Brgy. 180</option>
          <option value="Brgy. 183">Brgy. 183</option>
          <option value="Brgy. 186">Brgy. 186</option>
          <option value="Brgy. 187">Brgy. 187</option>
        </select>
        <label>Barangay</label>
      </div>
      <div class="form-group">
        <input type="text" name="landmark" class="input-field" placeholder=" " required>
        <label>Land Mark</label>
      </div>
      <div class="form-group">
        <input type="tel" name="mobile" class="input-field" placeholder=" " required>
        <label>Mobile Number</label>
      </div>
      <div class="form-group">
        <select name="plan" class="input-field" required>
          <option value="" disabled selected hidden></option>
          <option value="PLAN 799 (50mbps)">PLAN 799 (50mbps)</option>
          <option value="PLAN 999 (200mbps)">PLAN 999 (200mbps)</option>
          <option value="PLAN 1299 (350mbps)">PLAN 1299 (350mbps)</option>
        </select>
        <label>Select Plan</label>
      </div>

      <div class="btn-container">
        <button type="submit" class="btn btn-submit">
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
          Submit Application
        </button>
        <a href="index.html" class="btn btn-home">
          <svg viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
          </svg>
          Home
        </a>
      </div>
    </form>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzkkiD6x8g40cTP-JE8y7VWYM9RuHY0h0vAUslQjCIS2188-2Uro0WzAKKLA3p260jWKw/exec';
    const form = document.getElementById('appForm');
    const spinner = document.getElementById('spinner');
    const msgOverlay = document.getElementById('msg-overlay');
    const responseText = document.getElementById('response-text');
    form.addEventListener('submit', e => {
      e.preventDefault();
      spinner.style.display = 'flex';
      
      fetch(scriptURL, {
          method: 'POST',
          body: new FormData(form)
        })
        .then(response => {
          spinner.style.display = 'none';
          responseText.innerText = "Application Submitted! Please keep your lines open as you will be contacted by a Team Protech Technician to work on the service.";
          msgOverlay.style.display = 'flex';
          form.reset();
        })
        .catch(error => {
          spinner.style.display = 'none';
          responseText.innerText = "Error: " + error.message;
          responseText.style.color = "#ff4d4d";
          msgOverlay.style.display = 'flex';
          console.error('Error!', error.message);
        });
    });

    function closeMsg() {
      msgOverlay.style.display = 'none';
      responseText.style.color = "#fff";
    }
  </script>
</body>

</html>
